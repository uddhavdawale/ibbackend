spring.application.name=ibbackend
#spring.profiles.default=dev

# PostgreSQL Configuration
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_billing
spring.datasource.username=appuser
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate
# Flyway owns schema evolution; Hibernate must not auto-alter the live database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server
server.port=${PORT:8080}
server.host=localhost

# Logging
logging.level.root=INFO
logging.level.org.ib.ibbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [requestId=%X{requestId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [requestId=%X{requestId:-}] %logger{36} - %msg%n
logging.file.name=logs/ibbackend.log
logging.file.max-size=10MB
logging.file.max-history=30

# BCrypt
spring.security.password-encoder=bcrypt

# JWT secrets and session expiry (store in environment variables in production)
app.jwt.access-secret=${JWT_ACCESS_SECRET:dev-access-secret-change-me-please-32-plus-bytes-64-chars-long-123456}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-refresh-secret-change-me-please-32-plus-bytes-64-chars-long-654321}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_TOKEN_EXPIRY_MS:1800000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
app.security.enforce-active-refresh-session=${APP_SECURITY_ENFORCE_ACTIVE_REFRESH_SESSION:false}
app.security.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${APP_REFRESH_COOKIE_SAME_SITE:None}

app.security.login.encrypted-only=${APP_SECURITY_LOGIN_ENCRYPTED_ONLY:false}
# Set APP_MFA_OTP_HMAC_SECRET to an independent, randomly generated secret of at least 32 bytes.
# A separate key is recommended; the JWT refresh secret is a domain-separated compatibility fallback.
app.security.auth-flow.mfa-otp-hmac-secret=${APP_MFA_OTP_HMAC_SECRET:${app.jwt.refresh-secret}}

app.security.auth-flow.frontend-base-url=${APP_FRONTEND_BASE_URL:https://smartshopops.vercel.app}

app.security.auth-flow.password-reset-expiry-minutes=${APP_PASSWORD_RESET_EXPIRY_MINUTES:30}
app.security.auth-flow.mfa-challenge-expiry-minutes=${APP_MFA_CHALLENGE_EXPIRY_MINUTES:10}
# Backend decrypts login requests with the matching RSA private key.
# The public key is intended for the frontend and should be kept in the client assets / public_key.pem file.
# Set APP_SECURITY_LOGIN_RSA_PRIVATE_KEY_BASE64 in production.
security.login.rsa-private-key-base64=${APP_SECURITY_LOGIN_RSA_PRIVATE_KEY_BASE64:}
# Mail-based MFA configuration
app.mfa.mail.enabled=${APP_MFA_MAIL_ENABLED:false}
app.mfa.mail.otp-length=${APP_MFA_MAIL_OTP_LENGTH:6}
app.mfa.mail.expiry-minutes=${APP_MFA_MAIL_EXPIRY_MINUTES:5}
app.mfa.mail.subject=${APP_MFA_MAIL_SUBJECT:Login Verification Code}
app.mfa.mail.from=${APP_MFA_MAIL_FROM:gurushopops@outlook.com}
# Set BREVO_API_KEY in the deployment environment; never put the actual key in this file.
app.mail.provider=${APP_MAIL_PROVIDER:smtp}

#
# SMTP settings for OTP delivery
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

# Firebase OTP MFA configuration
app.mfa.firebase.enabled=${APP_MFA_FIREBASE_ENABLED:false}
app.mfa.firebase.project-id=${APP_MFA_FIREBASE_PROJECT_ID:guruibs-3d2d7}
app.mfa.firebase.credentials-path=${APP_MFA_FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
app.mfa.firebase.credentials-json-base64=${APP_MFA_FIREBASE_CREDENTIALS_JSON_BASE64:}
app.mfa.firebase.required-email-verified=${APP_MFA_FIREBASE_REQUIRED_EMAIL_VERIFIED:false}

# Upload safety limits
app.upload.max-size-bytes=${APP_UPLOAD_MAX_SIZE_BYTES:5242880}
app.upload.max-records=${APP_UPLOAD_MAX_RECORDS:5000}

# Private retailer logo and document storage
app.tenant-documents.encryption-key=${TENANT_DOCUMENT_ENCRYPTION_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=21MB

# CORS
#spring.web.cors.allowed-origins=http://localhost:5173 http://localhost:5175 https://smartshopops.vercel.app
#app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000,http://localhost:8080,https://ibfrontend.vercel.app,https://smartshopops.vercel.app}
# https://ibfrontend.vercel.app/dashboard https://smartshopops.vercel.app/

# Audit retention and archival policy
app.audit.retention.enabled=${APP_AUDIT_RETENTION_ENABLED:true}
app.audit.retention.cron=${APP_AUDIT_RETENTION_CRON:0 15 2 * * *}
app.audit.retention.zone=${APP_AUDIT_RETENTION_ZONE:UTC}
app.audit.retention.active-retention-days=${APP_AUDIT_ACTIVE_RETENTION_DAYS:180}
app.audit.retention.archive-retention-days=${APP_AUDIT_ARCHIVE_RETENTION_DAYS:730}
app.audit.retention.batch-size=${APP_AUDIT_RETENTION_BATCH_SIZE:1000}
app.audit.retention.max-batches-per-run=${APP_AUDIT_RETENTION_MAX_BATCHES:20}

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.demo.user.email=${APP_BOOTSTRAP_DEMO_USER_EMAIL:}
app.bootstrap.demo.user.password=${APP_BOOTSTRAP_DEMO_USER_PASSWORD:}
app.bootstrap.system.admin.one.email=${APP_BOOTSTRAP_SYSTEM_ADMIN_ONE_EMAIL:}
app.bootstrap.system.admin.one.password=${APP_BOOTSTRAP_SYSTEM_ADMIN_ONE_PASSWORD:}
app.bootstrap.system.admin.two.email=${APP_BOOTSTRAP_SYSTEM_ADMIN_TWO_EMAIL:}
app.bootstrap.system.admin.two.password=${APP_BOOTSTRAP_SYSTEM_ADMIN_TWO_PASSWORD:}