# Railway PostgreSQL - NO HARDCODED LOCALHOST!
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:yqSnWiXZMxejIxUunlnpTFjRFoqQFhQw}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable DDL on startup (prevents connection errors)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false

# Server port (Railway sets PORT automatically)
server.port=${PORT:8080}

# Logging (debug connection)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc=DEBUG
