spring.application.name=ibbackend
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_billing
spring.datasource.username=appuser
spring.datasource.password=apppassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080
server.host=localhost

#server.error.include-message=always
#server.error.include-binding-errors=always
#server.error.include-stacktrace=always

# BCrypt
spring.security.password-encoder=bcrypt

# CORS
spring.web.cors.allowed-origins=http://localhost:5173 http://localhost:5175
# https://ibfrontend.vercel.app/dashboard