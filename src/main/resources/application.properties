# Railway PostgreSQL - CORRECT JDBC FORMAT
spring.datasource.driver-class-name=org.postgresql.Driver

# Parse Railway's native URL and convert to JDBC
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres.railway.internal}:${PGPORT:5432}/${PGDATABASE:railway}?user=${PGUSER:postgres}&password=${PGPASSWORD:poHhFIWvidLZgnlqvGvwNxuTncCRyWSB}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false

server.port=${PORT:8080}

logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# BCrypt
spring.security.password-encoder=bcrypt

# CORS
spring.web.cors.allowed-origins=https://ibfrontend.vercel.app
