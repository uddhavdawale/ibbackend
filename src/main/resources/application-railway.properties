# Railway PostgreSQL service variables
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Require deployment secrets instead of using development fallback keys.
app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.demo.user.email=${APP_BOOTSTRAP_DEMO_USER_EMAIL:}
app.bootstrap.demo.user.password=${APP_BOOTSTRAP_DEMO_USER_PASSWORD:}
app.bootstrap.system.admin.one.email=${APP_BOOTSTRAP_SYSTEM_ADMIN_ONE_EMAIL:}
app.bootstrap.system.admin.one.password=${APP_BOOTSTRAP_SYSTEM_ADMIN_ONE_PASSWORD:}
app.bootstrap.system.admin.two.email=${APP_BOOTSTRAP_SYSTEM_ADMIN_TWO_EMAIL:}
app.bootstrap.system.admin.two.password=${APP_BOOTSTRAP_SYSTEM_ADMIN_TWO_PASSWORD:}

# Railway captures console output; keep any optional file log in writable ephemeral storage.
logging.file.name=/tmp/ibbackend.log
